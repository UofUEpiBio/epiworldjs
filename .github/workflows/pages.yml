name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74
    steps:
      - uses: actions/checkout@v4
      - run: make wasm
      # site/ at the root, with the package beside it (as test/e2e/serve.mjs
      # lays it out), so pages and snippets use <root>/dist/epiworld-model.js
      - name: Assemble the site
        run: |
          mkdir -p _site/site
          cp -R site/. _site/
          cp -R src dist _site/
          cp vendor/epiworld/LICENSE.md _site/LICENSE-epiworld.md
          cp vendor/measles/LICENSE.md _site/LICENSE-measles.md
          # The playground used to live at /site/
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=../"><a href="../">epiworldjs</a>\n' > _site/site/index.html
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
