name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74
    steps:
      - uses: actions/checkout@v4
      - run: make wasm
      # The site loads ../dist and ../src, so the layout of the repository is kept
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R site src dist _site/
          cp vendor/epiworld/LICENSE.md _site/LICENSE-epiworld.md
          cp vendor/measles/LICENSE.md _site/LICENSE-measles.md
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=site/"><a href="site/">epiworldjs</a>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
