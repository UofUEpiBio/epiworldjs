name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74
    steps:
      - uses: actions/checkout@v4
      # Same packages as .devcontainer/Dockerfile
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends clang libc++-dev libc++abi-dev
      - run: make check-version test-native wasm build/golden-native.txt build/golden.cjs
      # Run from the shell: make cannot exec node in this container
      - run: node --test test/*.test.js
      - name: Golden (native and WASM outputs must be identical)
        run: |
          node build/golden.cjs > build/golden-wasm.txt
          cmp build/golden-native.txt build/golden-wasm.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The site and the <epiworld-model> element in Chromium, with the WASM
  # module built above
  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
